name: Verify and publish example.game1
on:
  push:
    branches: [release]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: example-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      APPROVED_LICENSE_SHA256: ${{ vars.LICENSE_SHA256 }}
      APPROVED_NOTICE_SHA256: ${{ vars.NOTICE_SHA256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Require tag at current release HEAD
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py branch --tag "$GITHUB_REF_NAME"
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22, same as Host
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/release' && vars.LICENSE_SHA256 != '' && vars.NOTICE_SHA256 != '')
      - name: Independently build game and install public pinned Units
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/release' && vars.LICENSE_SHA256 != '' && vars.NOTICE_SHA256 != '')
        run: |
          set -euo pipefail
          mkdir -p dist/proof
          nix develop --no-update-lock-file --command odin version | tee dist/proof/odin-version.txt
          nix develop --no-update-lock-file --command zig version | tee dist/proof/zig-version.txt
          nix develop --no-update-lock-file --command make --trace -C game test web 2>&1 | tee dist/proof/game-build.txt
          nix develop --no-update-lock-file --command python3 scripts/build-receipt.py dist/proof/build-receipt.json
          # Calls install-releases.py install API with an exact-byte cache transport.
          # This is the only Unit download phase; final staging/checking are offline.
          python3 scripts/release.py install --lock release-lock.json
          tag="v$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          python3 scripts/release.py stage --tag "$tag"
          python3 scripts/release.py check --tag "$tag"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/release' && vars.LICENSE_SHA256 != '' && vars.NOTICE_SHA256 != '')
        with:
          name: example-${{ github.ref_name }}
          path: dist/candidate/
          if-no-files-found: error
      - name: Preserve verifier inputs and browser build proof (not release attachments)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/release' && vars.LICENSE_SHA256 != '' && vars.NOTICE_SHA256 != '')
        with:
          name: verifier-${{ github.ref_name }}
          path: |
            build.nosync/release-assets/
            game/build.nosync/web/
            dist/proof/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APPROVED_LICENSE_SHA256: ${{ vars.LICENSE_SHA256 }}
      APPROVED_NOTICE_SHA256: ${{ vars.NOTICE_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/release.py branch --tag "$GITHUB_REF_NAME"
          python3 scripts/release.py absent --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: example-${{ github.ref_name }}
          path: dist/candidate/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verifier-${{ github.ref_name }}
          path: ./
      - name: Independent offline pin/receipt/source/ZIP check
        run: |
          python3 scripts/release.py install --lock release-lock.json --offline
          python3 scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Publish immutable public tag release (no Pages)
        run: |
          python3 scripts/release.py branch --tag "$GITHUB_REF_NAME"
          python3 scripts/release.py absent --tag "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/candidate/*
